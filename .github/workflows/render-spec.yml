name: Render reviewed Reel Spec

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: Path under reels/specs
        required: true
        type: string
      issue_number:
        description: Topic Issue number
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: topic-lifecycle-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Issue and Reel Spec gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid Issue number" >&2; exit 1; }
          [[ "$SPEC_PATH" =~ ^reels/specs/[a-z0-9][a-z0-9._/-]*\.json$ ]] || { echo "Invalid Reel Spec path" >&2; exit 1; }
          [[ "$SPEC_PATH" != *".."* ]] || { echo "Invalid Reel Spec path" >&2; exit 1; }
          labels="$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')"
          grep -Fxq topic-proposal <<<"$labels"
          grep -Fxq state:ready-to-render <<<"$labels"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.render_spec import contained_spec
          from src.spec_reel import load_spec

          path = contained_spec(Path(os.environ["SPEC_PATH"]))
          spec = load_spec(path)
          if spec["issue_number"] != int(os.environ["ISSUE"]):
              raise SystemExit("Reel Spec issue_number does not match workflow input")
          PY
          gh issue edit "$ISSUE" --remove-label state:ready-to-render --add-label state:rendering

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Render and verify
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
        run: python scripts/render_spec.py --spec "$SPEC_PATH" --output-dir render-output

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reel-preview-issue-${{ inputs.issue_number }}
          path: render-output/
          retention-days: 30

      - name: Publish preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')"
          grep -Fxq state:rendering <<<"$labels"
          gh issue view "$ISSUE" --json body --jq .body > /tmp/current-issue-body.md
          python - <<'PY'
          from pathlib import Path
          from scripts.issue_decision import parse_decision

          if parse_decision(Path("/tmp/current-issue-body.md").read_text(encoding="utf-8")) != "approve":
              raise SystemExit("Approval was revoked before preview publication")
          PY
          if ! gh release view preview-assets >/dev/null 2>&1; then
            gh release create preview-assets --prerelease --title "Reel preview assets" --notes "Human-review previews. Nothing here is publication-approved."
          fi
          gh release upload preview-assets render-output/* --clobber

      - name: Move to preview review
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/wellness-reel-studio/
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')"
          grep -Fxq state:rendering <<<"$labels"
          slug="$(python -c 'import glob, json; print(json.load(open(glob.glob("render-output/*.preview.json")[0]))["slug"])')"
          gh issue edit "$ISSUE" --remove-label state:rendering --add-label state:preview-review
          gh workflow run deploy-pages.yml
          gh issue comment "$ISSUE" --body "The verified render is ready for human review on the [Pages dashboard]($PAGES_URL?reel=$slug). Build files are retained in the [workflow artifact]($RUN_URL). This is not publication approval."

      - name: Restore reviewable state after failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')"
          if grep -Fxq state:rendering <<<"$labels"; then
            gh issue edit "$ISSUE" --remove-label state:rendering --add-label state:ready-to-render
            gh issue comment "$ISSUE" --body "Rendering failed and the Issue was returned to ready-to-render. Review the [workflow run]($RUN_URL) before trying again."
          fi
