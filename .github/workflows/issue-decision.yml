name: Validate topic decision

on:
  issues:
    types: [edited]

permissions:
  actions: write
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify editor has write access
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "Actor does not have permission to make topic decisions" >&2; exit 1 ;;
          esac

      - id: decision
        name: Validate checkboxes
        run: python scripts/issue_decision.py --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"

      - name: Queue trusted lifecycle transition
        if: steps.decision.outputs.is_topic == 'true' && steps.decision.outputs.decision_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.decision.outputs.issue_number }}
          DECISION: ${{ steps.decision.outputs.decision }}
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid Issue number" >&2; exit 1; }
          case "$DECISION" in approve|reject|invalid) ;; *) exit 1 ;; esac
          gh workflow run apply-decision.yml -f issue_number="$ISSUE" -f decision="$DECISION"
